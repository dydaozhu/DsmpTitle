# DSMPTitle ProGuard configuration
-keep public class com.dsmp.title.DSMPTitlePlugin {
    public <init>();
    public void onEnable();
    public void onDisable();
    public boolean onCommand(org.bukkit.command.CommandSender, org.bukkit.command.Command, java.lang.String, java.lang.String[]);
    public java.util.List onTabComplete(org.bukkit.command.CommandSender, org.bukkit.command.Command, java.lang.String, java.lang.String[]);
}
-keepclassmembers,allowoptimization,allowobfuscation class com.dsmp.title.** {
    @org.bukkit.event.EventHandler <methods>;
}
-keepattributes RuntimeVisibleAnnotations,RuntimeInvisibleAnnotations,RuntimeVisibleParameterAnnotations,RuntimeInvisibleParameterAnnotations,AnnotationDefault,Signature,InnerClasses,EnclosingMethod,Exceptions
-optimizationpasses 7
-allowaccessmodification
-useuniqueclassmembernames
-dontusemixedcaseclassnames
-obfuscationdictionary obfuscation-dictionary.txt
-classobfuscationdictionary class-obfuscation-dictionary.txt
-packageobfuscationdictionary package-obfuscation-dictionary.txt
-dontwarn org.bukkit.**
-dontwarn io.papermc.**
-dontwarn net.luckperms.**
-dontwarn net.milkb0x.**
-dontwarn net.milkbowl.**
-dontwarn net.kyori.**
